[package]
name = "chelp"
version = "0.1.2"
edition = "2021"
authors = ["chelp contributors"]
description = "Universal AI-Powered CLI Assistant & Autocomplete Engine"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
rusqlite = { version = "0.31", features = ["bundled"] }
regex = "1.10"
# use-dev-tty: poll the terminal via poll(2) instead of kqueue. On macOS a
# freshly opened /dev/tty fd cannot be kqueue-registered (EINVAL), which broke
# input whenever stdin was not a tty (zsh ZLE widgets, redirected stdin).
crossterm = { version = "0.27", features = ["use-dev-tty"] }
ratatui = "0.26"
reqwest = { version = "0.12", features = ["json", "hickory-dns"] }
interprocess = { version = "2.2", features = ["tokio"] }
toml = "0.8"
async-trait = "0.1"

[dev-dependencies]
tempfile = "3.10"
assert_cmd = "2.0"
predicates = "3.1"
portable-pty = "0.8"
